name: Publish ARM64 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies and check production build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Read image repository from deployment contract
        id: image
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { imageRepository, platform } = JSON.parse(readFileSync('deploy.json', 'utf8'));
          if (imageRepository !== 'ghcr.io/hurdoo/kucc-vibe-study' || platform !== 'linux/arm64') {
            throw new Error('Unexpected deployment image repository or platform');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `repository=${imageRepository}\nplatform=${platform}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish repository-linked image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.image.outputs.platform }}
          push: true
          tags: ${{ steps.image.outputs.repository }}:bootstrap-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/HURDOO/kucc-vibe-study
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          printf 'Image: `%s@%s`\n\nRevision: `%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
